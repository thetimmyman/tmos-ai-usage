---
# The plugin's own gate: the same command a release is cut on, run on every
# push. `omarchy plugin validate` needs an Omarchy host and qmllint needs Qt's
# declarative tools, so both are installed best-effort and the script prints a
# SKIP rather than failing when one is absent.
#
# Actions are pinned to full commit SHAs: a tag can be moved, and this repo's
# own security review looks at unpinned external execution.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # v4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.x"
      - name: Install qmllint (Qt declarative tools)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qt6-declarative-dev-tools nodejs
      - name: Run the gate
        run: ./scripts/check.sh
